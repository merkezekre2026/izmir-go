name: deploy-edge

# Free deployment of the İzmir Go API to Cloudflare Workers (free plan).
# 1. Fetch + validate the operators' feeds and build the static bundle (Python, no database).
# 2. Deploy the Worker + bundle with Wrangler.
# A failed build never deploys, so the previously deployed data stays online.
#
# Needs repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID. Optional variable EDGE_REQUIRED_SOURCES (default "metro,tram").
on:
  schedule:
    - cron: "17 2 * * *"   # daily, 05:17 İzmir time (timetables + ESHOT stop list/announcements)
  push:
    branches: [main]
    paths: ["edge/**", "backend/src/**", "data/**", ".github/workflows/deploy-edge.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv python install 3.13
      - name: Install backend
        working-directory: backend
        run: uv sync --frozen --no-dev
      - name: Build data bundle from live feeds
        working-directory: backend
        env:
          REQUIRED: ${{ vars.EDGE_REQUIRED_SOURCES || 'metro,tram' }}
          IZMIRGO_DATA_DIR: ${{ runner.temp }}/izmirgo
        run: |
          args=()
          IFS=',' read -ra req <<< "$REQUIRED"
          for s in "${req[@]}"; do args+=(--require "$s"); done
          uv run izmirgo-ingest build-bundle --out ../edge/public/data "${args[@]}"
          du -sh ../edge/public/data
          find ../edge/public/data -type f | wc -l
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - name: Install and type-check Worker
        working-directory: edge
        run: npm ci && npx tsc --noEmit
      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set; bundle built but not deployed. See docs/deploy-cloudflare.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.ok == 'true'
        working-directory: edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke test
        if: steps.creds.outputs.ok == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [[ -z "$API_BASE_URL" ]]; then
            echo "::notice::Set the API_BASE_URL variable (https://izmir-go-api.<subdomain>.workers.dev/api/v1) to smoke-test deploys."
            exit 0
          fi
          sleep 5
          curl -fsS "$API_BASE_URL/health"
          curl -fsS "$API_BASE_URL/transit/status" | head -c 400; echo
