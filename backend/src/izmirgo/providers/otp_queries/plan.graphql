query Plan($origin: PlanLabeledLocationInput!, $destination: PlanLabeledLocationInput!, $dateTime: PlanDateTimeInput!, $first: Int) {
  planConnection(origin: $origin, destination: $destination, dateTime: $dateTime, first: $first) {
    searchDateTime
    routingErrors { code description inputField }
    edges { node {
      start end duration numberOfTransfers walkDistance waitingTime
      legs {
        mode transitLeg duration distance headsign serviceDate
        start { scheduledTime estimated { time } }
        end { scheduledTime estimated { time } }
        from { name lat lon stop { gtfsId parentStation { gtfsId } } }
        to { name lat lon stop { gtfsId parentStation { gtfsId } } }
        route { gtfsId shortName longName color textColor mode }
        trip { gtfsId tripHeadsign directionId }
        legGeometry { points length }
        stopCalls { stopLocation { ... on Stop { gtfsId name lat lon } } schedule { time { ... on ArrivalDepartureTime { arrival departure } } } }
      }
    } }
  }
}
