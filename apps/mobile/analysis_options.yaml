include: package:very_good_analysis/analysis_options.yaml

formatter:
  page_width: 100

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
    - build/**
    - android/**
    - ios/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    public_member_api_docs: false
    lines_longer_than_80_chars: false
    sort_pub_dependencies: false
    # New in Dart 3.13; conflicts with Freezed's `const factory X(...)` style.
    unnecessary_type_name_in_constructor: false
    # Riverpod provider types are long and fully inferred; annotating them adds noise.
    specify_nonobvious_property_types: false
