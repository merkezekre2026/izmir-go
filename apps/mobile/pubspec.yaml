name: izmir_go
description: "İzmir Go - toplu taşıma yol arkadaşı"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # pinned by flutter_localizations
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  geolocator: ^14.1.2
  maplibre_gl: ^0.27.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  drift_dev: ^2.35.2
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
